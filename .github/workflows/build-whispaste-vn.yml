name: Build WhisPaste VN Windows
# One-time user-authorized build for the Light Neumorphism feature branch.
# Restore workflow_dispatch-only as soon as the build is queued.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/whispaste-vn-soft-neumorphism
    paths:
      - .github/one-shot/neumorphism-rebuild-after-vn-fix-20261013.txt

concurrency:
  group: whispaste-vn-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vietnamese code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate translations
        run: flutter gen-l10n
      - name: Static analysis for modified code
        run: flutter analyze --no-fatal-infos lib/core/l10n lib/core/config/settings_sections.dart lib/features/settings lib/services/vietnamese_admin_text.dart lib/services/recording_orchestrator.dart lib/widgets/language_selector.dart lib/widgets/title_bar.dart
      - name: Run Vietnamese locale and document tests
        run: flutter test test/core/l10n/vietnamese_locale_test.dart test/services/vietnamese_admin_text_test.dart

  windows:
    name: Package Windows ZIP and installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        run: |
          flutter gen-l10n
          flutter build windows --release --no-tree-shake-icons --dart-define=APP_VERSION=1.3.0
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows build failed" }
      - name: Activate native C++ toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache local Whisper libraries
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: .build/libwhisper/windows
          key: whispaste-vn-whisper-vulkan-cpu-variants-1.8.4-v1
      # Only provision the SDK when a fresh native build is necessary.
      - name: Install Vulkan SDK (build-time only)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Compile whisper.cpp Vulkan + optimized CPU fallback
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".build/deps/whisper.cpp" | Out-Null
          git clone --depth 1 --branch v1.8.4 https://github.com/ggml-org/whisper.cpp ".build/deps/whisper.cpp/v1.8.4"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download whisper.cpp" }
          cmake -S ".build/deps/whisper.cpp/v1.8.4" -B ".build/libwhisper/windows-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          if ($LASTEXITCODE -ne 0) { throw "Whisper CMake configuration failed" }
          cmake --build ".build/libwhisper/windows-build" --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Whisper compilation failed" }
          New-Item -ItemType Directory -Force -Path ".build/libwhisper/windows" | Out-Null
          Copy-Item ".build/libwhisper/windows-build/bin/*.dll" ".build/libwhisper/windows/" -Force
          $whisperDll = Join-Path ".build/libwhisper/windows" "whisper.dll"
          $vulkanDll = Join-Path ".build/libwhisper/windows" "ggml-vulkan.dll"
          $cpuBackends = @(Get-ChildItem ".build/libwhisper/windows" -Filter "ggml-cpu*.dll")
          if (-not (Test-Path $whisperDll)) { throw "Missing whisper.dll" }
          if (-not (Test-Path $vulkanDll)) { throw "Missing Vulkan backend: ggml-vulkan.dll" }
          if ($cpuBackends.Count -eq 0) { throw "Missing CPU fallback backend" }
          Write-Host "Verified Whisper DLLs including Vulkan and $($cpuBackends.Count) CPU variant(s)"
      - name: Bundle local Whisper dependencies
        shell: pwsh
        run: |
          pwsh scripts/bundle-libwhisper-windows.ps1 -Source .build/libwhisper/windows
          if ($LASTEXITCODE -ne 0) { throw "Bundling local Whisper failed" }
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$releaseDir/whisper.dll")) {
            throw "whisper.dll missing; offline recognition would fail"
          }
          if (-not (Test-Path "$releaseDir/ggml-vulkan.dll")) {
            throw "Vulkan acceleration DLL missing from the portable release"
          }
          $cpuBackends = @(Get-ChildItem $releaseDir -Filter "ggml-cpu*.dll")
          if ($cpuBackends.Count -eq 0) {
            throw "CPU fallback DLL missing from the portable release"
          }
          Write-Host "Package backends: CPU + Vulkan (GPU selected automatically at runtime)"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "release-artifacts/WhisPaste-VN-Windows-x64.zip" -Force
      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: WhisPaste-VN-Windows
          path: release-artifacts/WhisPaste-VN-Windows-x64.zip
          if-no-files-found: error
      - name: Install NSIS for setup
        shell: pwsh
        continue-on-error: true
        run: choco install nsis -y --no-progress
      - name: Build optional NSIS installer
        shell: pwsh
        continue-on-error: true
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { Write-Warning "NSIS not installed"; exit 0 }
          & $nsis /DPRODUCT_VERSION=1.3.0 /DPRODUCT_VERSION_NUMERIC=1.3.0.48 installer/whispaste.nsi
          if ($LASTEXITCODE -eq 0 -and (Test-Path installer/WhisPaste-Setup.exe)) {
            Copy-Item installer/WhisPaste-Setup.exe "release-artifacts/WhisPaste-VN-Setup.exe"
          }
      - name: Upload optional setup installer
        uses: actions/upload-artifact@v6
        with:
          name: WhisPaste-VN-Setup
          path: release-artifacts/WhisPaste-VN-Setup.exe
          if-no-files-found: ignore
